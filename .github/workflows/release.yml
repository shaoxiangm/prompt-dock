name: 打包和发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: prompt-dock-windows-x64
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: prompt-dock-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装 Rust 目标
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - run: npm ci
      - name: 编译与打包
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
      - name: 整理 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "src-tauri/target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Path packages
          Copy-Item "$root/prompt-dock.exe" "packages/prompt-dock-windows-x64.exe"
          $installer = Get-ChildItem "$root/bundle/nsis" -Filter '*.exe' -File
          if (@($installer).Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          Copy-Item $installer.FullName "packages/prompt-dock-windows-x64-setup.exe"
      - name: 整理 macOS 产物
        if: runner.os == 'macOS'
        shell: bash
        run: |
          root="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir packages
          dmg=("$root"/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          cp "${dmg[0]}" packages/prompt-dock-macos-arm64.dmg
          lipo -verify_arch arm64 "$root/macos/Prompt Dock.app/Contents/MacOS/prompt-dock"
          ditto -c -k --keepParent "$root/macos/Prompt Dock.app" packages/prompt-dock-macos-arm64-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prompt-dock-release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prompt-dock-*
          path: packages
          merge-multiple: true
      - name: 发布四个构建产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          files=(packages/*)
          test "${#files[@]}" -eq 4
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --generate-notes
          fi
